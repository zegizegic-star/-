name: Finance Tracker — build Windows exe

on:
  push:
    branches: ["**"]
    paths:
      - "finance_tracker/**"
      - ".github/workflows/finance-tracker-build.yml"
  pull_request:
    paths:
      - "finance_tracker/**"
  workflow_dispatch: {}

jobs:
  build-windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: finance_tracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build .exe with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "МоиФинансы" `
            --icon "icon.ico" --add-data "icon.ico;." --collect-data certifi `
            --hidden-import PIL._tkinter_finder app.py

      - name: Smoke-test the built exe
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\МоиФинансы.exe" -PassThru
          Start-Sleep -Seconds 6
          if ($proc.HasExited) {
            Write-Error "Application exited early with code $($proc.ExitCode)"
            exit 1
          }
          Stop-Process -Id $proc.Id -Force
          if (-not (Test-Path "dist\finance_data.db")) {
            Write-Error "finance_data.db was not created next to the exe"
            exit 1
          }
          Write-Host "Smoke test passed: exe launched and created finance_data.db"

      - uses: actions/upload-artifact@v4
        with:
          name: MoiFinansy-windows-exe
          path: finance_tracker/dist/МоиФинансы.exe
